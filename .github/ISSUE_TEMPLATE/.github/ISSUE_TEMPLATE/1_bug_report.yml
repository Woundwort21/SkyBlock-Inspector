name: Bug report
description: Report a problem with SkyBlock Inspector.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve SkyBlock Inspector! Please remove personal information from screenshots and logs before uploading them.
  - type: dropdown
    id: minecraft-version
    attributes:
      label: Minecraft version
      options:
        - "26.2"
        - "26.3"
        - Other
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: SkyBlock Inspector version
      description: "Example: 0.9.2 or 0.9.3."
      placeholder: "0.9.3"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Affected feature
      options:
        - Garden crops / growth
        - Mining / area detection
        - NPC identification
        - HUD / scaling / dragging
        - Settings / keybinds
        - Installation / mod compatibility
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
      placeholder: "What I saw... / What I expected..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can we make the same issue happen?
      placeholder: |
        1. Join Hypixel SkyBlock...
        2. Open...
        3. Look at...
    validations:
      required: true
  - type: textarea
    id: installed-mods
    attributes:
      label: Other installed mods (if relevant)
      description: Mention mods that might conflict; do not share account information.
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs (optional)
      description: Drag files here, or paste a link. Review logs for usernames, server IPs, and other private data first.
    validations:
      required: false
